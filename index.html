<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ninanz</title>
<meta name="description" content="Tus negocios, tus finanzas y tus notas en un solo sitio.">
<meta name="theme-color" content="#E9EAEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ninanz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: cristal esmerilado sobre un fondo de luz de atardecer. Pestañas en píldora arriba (escritorio) o abajo (móvil), dock de acciones a la izquierda, tarjetas translúcidas. Blanco y negro suave; el azul solo marca lo seleccionado. */
:root{
  --bg:#E9EAEC; --ink:#14161A; --muted:#5C626C;
  --surface:rgba(255,255,255,.58); --surface2:rgba(255,255,255,.4); --field:rgba(255,255,255,.72); --sheet:rgba(247,247,248,.88); --splash:rgba(233,234,236,.8);
  --line:rgba(20,22,26,.1); --line-strong:rgba(20,22,26,.3);
  --accent:#14161A; --accent-ink:#FFFFFF; --accent-soft:rgba(20,22,26,.07);
  --in:#1F8458; --out:#C0503C; --warn:#9A6A12; --hi:#4B78EC; --viol:#7461D6;
  --in-bg:rgba(31,132,88,.14); --out-bg:rgba(192,80,60,.14);
  --bsoft-in:rgba(75,120,236,.34); --bsoft-out:rgba(192,80,60,.3);
  --scene:radial-gradient(60% 55% at 85% 6%,rgba(255,206,150,.78),transparent 62%),radial-gradient(55% 60% at 6% 94%,rgba(150,180,225,.68),transparent 62%),radial-gradient(40% 40% at 50% 50%,rgba(255,255,255,.5),transparent 70%),linear-gradient(160deg,#EEEDEB,#DADFE5);
  --shadow:inset 0 1px 0 rgba(255,255,255,.65),0 14px 40px rgba(30,40,60,.12);
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --navh:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1013; --ink:#F2F3F5; --muted:#A3A9B3;
    --surface:rgba(40,43,50,.52); --surface2:rgba(255,255,255,.07); --field:rgba(255,255,255,.07); --sheet:rgba(30,32,38,.86); --splash:rgba(14,16,19,.8);
    --line:rgba(255,255,255,.11); --line-strong:rgba(255,255,255,.3);
    --accent:#F2F3F5; --accent-ink:#101114; --accent-soft:rgba(255,255,255,.1);
    --in:#5CC48F; --out:#EE8470; --warn:#E0A43C; --hi:#6E97FF; --viol:#A394F0;
    --in-bg:rgba(92,196,143,.16); --out-bg:rgba(238,132,112,.16);
    --bsoft-in:rgba(110,151,255,.34); --bsoft-out:rgba(238,132,112,.3);
    --scene:radial-gradient(60% 55% at 85% 6%,rgba(206,150,96,.40),transparent 62%),radial-gradient(55% 60% at 6% 94%,rgba(84,112,160,.45),transparent 62%),radial-gradient(35% 35% at 55% 45%,rgba(255,255,255,.05),transparent 70%),linear-gradient(160deg,#1A1C21,#0C0D10);
    --shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1013; --ink:#F2F3F5; --muted:#A3A9B3;
    --surface:rgba(40,43,50,.52); --surface2:rgba(255,255,255,.07); --field:rgba(255,255,255,.07); --sheet:rgba(30,32,38,.86); --splash:rgba(14,16,19,.8);
    --line:rgba(255,255,255,.11); --line-strong:rgba(255,255,255,.3);
    --accent:#F2F3F5; --accent-ink:#101114; --accent-soft:rgba(255,255,255,.1);
    --in:#5CC48F; --out:#EE8470; --warn:#E0A43C; --hi:#6E97FF; --viol:#A394F0;
    --in-bg:rgba(92,196,143,.16); --out-bg:rgba(238,132,112,.16);
    --bsoft-in:rgba(110,151,255,.34); --bsoft-out:rgba(238,132,112,.3);
    --scene:radial-gradient(60% 55% at 85% 6%,rgba(206,150,96,.40),transparent 62%),radial-gradient(55% 60% at 6% 94%,rgba(84,112,160,.45),transparent 62%),radial-gradient(35% 35% at 55% 45%,rgba(255,255,255,.05),transparent 70%),linear-gradient(160deg,#1A1C21,#0C0D10);
    --shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.35);
    color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.shell{max-width:1060px;margin:0 auto;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--display);letter-spacing:-.02em}
.top-r{display:flex;align-items:center;gap:10px}
.pill{font:500 11px/1 var(--mono);color:var(--muted);border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:99px;white-space:nowrap}
.work{display:block}
main{min-width:0;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(var(--navh) + 96px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);
  font:500 11px/1 var(--body);padding:8px 4px;border-radius:20px;min-width:0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.dock{display:none}
.dk{width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.dk svg{width:19px;height:19px}
.dk:hover{background:var(--accent-soft);color:var(--ink)}
.dk.primary{background:var(--ink);color:var(--bg)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:860px){
  body{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  .shell{max-width:1280px}
  .top{display:grid;grid-template-columns:1fr auto 1fr}
  .top-r{justify-content:flex-end}
  .nav{position:static;display:inline-flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow)}
  .nav button{flex:none;flex-direction:row;gap:8px;font-size:13.5px;padding:10px 16px;border-radius:99px}
  .nav button svg{width:16px;height:16px}
  .nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
  .work{display:grid;grid-template-columns:60px minmax(0,1fr);gap:22px;align-items:start}
  .dock{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;padding:8px;border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow)}
  main{padding-bottom:96px}
  .fab{display:none}
}
.hero{padding:6px 0 2px}
.eyebrow{font:500 12px/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
h1{font:700 32px/1.1 var(--display);letter-spacing:-.025em;margin-top:6px}
h2{font:700 17px/1.2 var(--display);letter-spacing:-.01em}
h3{font:700 20px/1.2 var(--display);letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px;min-width:0}
.tile .l{font:500 11px/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font:700 clamp(17px,4.6vw,26px)/1.15 var(--display);letter-spacing:-.02em;margin-top:6px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tile .s{font:400 11px/1.3 var(--mono);color:var(--muted);margin-top:4px}
.pos{color:var(--in)}.neg{color:var(--out)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.legend{display:flex;gap:12px;font:500 11px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:10px 16px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:19px;height:19px}
.icon-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:500;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px var(--line-strong)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.amt{font:500 15px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.day{font:500 11px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 0 4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.exp i{background:var(--muted)}
.mini{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.mini:first-child{border-top:0;padding-top:0}
.mini .l{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ncards{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.ncards{grid-template-columns:1fr 1fr}}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stats3 .l{font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stats3 .v{font:600 15px var(--mono);margin-top:3px;overflow-wrap:anywhere}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--line);border-radius:22px;padding:14px 16px;font-size:13.5px}
.banner p{flex:1;min-width:200px}
.empty{padding:18px 4px;color:var(--muted);text-align:center}
.cta{display:flex;flex-direction:column;gap:10px}
.cta p{color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bi{fill:var(--hi)}.chart .bo{fill:var(--out)}
.chart text{fill:var(--muted);font:10px var(--mono)}
.chart text.cur{fill:var(--ink);font-weight:500}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:12px 18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>span{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:18px;padding:11px 12px;min-height:46px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:14px}
.seg label{display:block}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px;border-radius:99px;font-weight:600;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:32px;height:32px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.swatches input:checked+span{border-color:var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.acts .sp{flex:1}
.err{color:var(--out);font-size:13px;min-height:18px;margin-bottom:6px}
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet .ov{position:absolute;inset:0;background:rgba(5,20,19,.5)}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:30px 30px 0 0;width:100%;max-width:520px;max-height:92%;overflow-y:auto;
  padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.sheet h3{margin-bottom:14px}
@media (min-width:700px){#sheet{align-items:center}.sheet{border-radius:30px}}
.opt{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:13px 16px;margin-bottom:8px}
.opt b{font-weight:600}.opt small{color:var(--muted)}
.fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:14px 20px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab svg{width:18px;height:18px}
@media (min-width:860px){.fab{bottom:24px}}
.ed-bar{display:flex;align-items:center;gap:8px}
.ed-bar .sp{flex:1}
.doc{padding:18px}
.titulo{width:100%;border:0;background:transparent;font:700 26px/1.2 var(--display);letter-spacing:-.02em;padding:4px 0;outline:none}
.doc .meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
.doc .meta select{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:5px 10px;font-size:13px}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent)}
.blk{display:flex;align-items:flex-start;gap:8px}
.bt{flex:1;min-width:0;border:0;background:transparent;resize:none;overflow:hidden;padding:6px 0;outline:none;line-height:1.5;border-radius:6px}
.t-h .bt{font:700 19px/1.3 var(--display);padding-top:12px}
.t-c.done .bt{color:var(--muted);text-decoration:line-through}
.cb{width:22px;height:22px;margin-top:7px;border:1.5px solid var(--line-strong);border-radius:7px;background:var(--surface);display:grid;place-items:center;color:transparent;flex:none;padding:0}
.cb svg{width:14px;height:14px}
.cb[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.more{width:32px;height:32px;margin-top:3px;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center;opacity:.55;flex:none}
.more:hover,.more:focus-visible,.blk:focus-within .more{opacity:1}
.more svg{width:18px;height:18px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .cb{margin-top:2px}
.task .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.task .open b{display:block;font-weight:500;overflow-wrap:anywhere}
.task .open small{color:var(--muted);font-size:12px}
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:92%;border-radius:22px;padding:11px 14px;overflow-wrap:anywhere;min-width:0}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.bub.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub p+p,.bub p+ul,.bub ul+p,.bub ol+p,.bub p+ol{margin-top:8px}
.bub ul,.bub ol{margin:6px 0 0;padding-left:20px}
.bub li+li{margin-top:3px}
.bub h4{font:700 15px var(--display);margin-top:6px}
.bub code{font:13px var(--mono);background:var(--surface2);padding:1px 5px;border-radius:5px}
.bub .acts{justify-content:flex-start;margin-top:10px}
.think{color:var(--muted);display:flex;gap:6px;align-items:center}
.think i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite ease-in-out}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.think i{animation:none;opacity:.7}}
.composer{position:sticky;bottom:calc(var(--navh) + 8px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line-strong);border-radius:28px;padding:8px;display:flex;gap:8px;align-items:flex-end;box-shadow:var(--shadow)}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;outline:none;padding:8px 8px;max-height:140px;line-height:1.4}
@media (min-width:860px){.composer{bottom:12px}}
.note-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 14px;margin-bottom:10px}
.note-item .t{font-weight:600;display:flex;gap:8px;align-items:center;overflow-wrap:anywhere}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function parseD(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function isoD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDias(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return isoD(d)}
function lunesDe(s){var d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoD(d)}
function ultimoDia(k){return new Date(Number(k.slice(0,4)),Number(k.slice(5,7)),0).getDate()}

function periodo(per){
  var hoy=hoyStr(),b=[],cur=0,lab,ant,from,to,pf,pt;
  if(per==='sem'){
    from=lunesDe(hoy);to=addDias(from,6);pf=addDias(from,-7);pt=addDias(from,-1);
    var dn=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    for(var i=0;i<7;i++){var d=addDias(from,i);b.push({a:d,b:d,l:dn[i]});if(d===hoy)cur=i}

  }else if(per==='mes'){
    var k=mk(hoy),n=ultimoDia(k),dh=Number(hoy.slice(8)),pk=shiftMes(k,-1);
    from=k+'-01';to=k+'-'+pad(n);pf=pk+'-01';pt=pk+'-'+pad(ultimoDia(pk));
    [[1,7],[8,14],[15,21],[22,28],[29,31]].forEach(function(c,i){

function delta(c,pr,inv){

}

  var l=pts[pts.length-1];

function inl(s){return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(t){
  var lines=esc(t).split('\n'),out='',list=null;
  function close(){if(list){out+='</'+list+'>';list=null}}
  lines.forEach(function(ln){
    var m;
    if((m=ln.match(/^\s*[-*•]\s+(.*)$/))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>'}
    else if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+='<li>'+inl(m[1])+'</li>'}
    else if((m=ln.match(/^\s*#{1,4}\s+(.*)$/))){close();out+='<h4>'+inl(m[1])+'</h4>'}
    else if(!ln.trim()){close()}
    else{close();out+='<p>'+inl(ln)+'</p>'}
  });
  close();return out;
}

function bloquesDeTexto(t){
  var out=[];
  t.split('\n').forEach(function(ln){

  else L.push('No hay negocios creados.');

  var cl=Object.keys(cats).map(function(c){return c+' '+cats[c].toFixed(2)});if(cl.length)L.push('Gastos del mes por categoría: '+cl.join('; '));
  var ts=tareasAbiertas().slice(0,20);L.push(ts.length?'Tareas abiertas:\n'+ts.map(function(t){return '- '+t.b.x+' (nota: '+(t.n.titulo||'sin título')+')'}).join('\n'):'No hay tareas abiertas.');

function copyErr(e){

  if(c==='not_granted')return 'No has permitido que esta página use la IA. Recarga la página y acepta el permiso para usarla.';
  if(c==='rate_limited')return 'Has hecho muchas preguntas seguidas o alcanzado tu límite de uso. Inténtalo más tarde.';
  if(c==='session_expired')return 'Tu sesión ha caducado. Vuelve a iniciar sesión y prueba otra vez.';

function apiSample(input,o){
  /* Fuera de Claude: llama a /api/chat. input[0] son las instrucciones; el resto es la conversación. */
  var code='';try{code=localStorage.getItem('ninance-code')||''}catch(e){}
  return fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','x-ninance-code':code},
    body:JSON.stringify({system:input[0].content,messages:input.slice(1),voz:!!(o&&o.voz),web:!!(o&&o.web)}),signal:o&&o.signal}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){throw {code:r.status===401?'need_code':r.status===429?'rate_limited':(r.status===500&&j.error)?'config':'upstream_error',message:j.error||''}}
      if(o&&o.onText)o.onText({text:j.text,delta:j.text});
      return {text:j.text,truncated:!!j.truncated,fuentes:j.fuentes||[]};
    });
  },function(err){

  });
}

function resumenVoz(t){
  var x=String(t||'').split('\n\nFuentes:')[0].replace(/\*\*|[#*_`>]/g,'').replace(/^\s*[-•]\s+/gm,'').replace(/\n+/g,'. ').trim();
  if(x.length<=380)return x;

function elegirVoz(){
  var vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}
  var es=vs.filter(function(v){return /^es(-|_|$)/i.test(v.lang)});
  var pref=es.filter(function(v){return /es[-_]ES/i.test(v.lang)});
  var pool=pref.length?pref:es;
  var masc=pool.filter(function(v){return /jorge|diego|pablo|alvaro|enrique|male|google espa/i.test(v.name)});
  return (masc[0]||pool[0]||null);
}
function decir(txt,fin){
  var limpio=String(txt||'').replace(/\*\*|[#*_`>]/g,'').replace(/^\s*[-•]\s+/gm,'').replace(/\n+/g,'. ').slice(0,700);
  VZ.pensando=false;VZ.hablando=true;VZ.pend=null;
  if(VZ.activo||VZ.ov)pintaVoz('habla',null,limpio);
  try{if(VZ.rec&&VZ.corriendo)VZ.rec.abort()}catch(e){}
  var hecho=false;
  function listo(){
    if(hecho)return;hecho=true;VZ.hablando=false;
    if(fin){fin();return}
    if(VZ.activo){pintaVoz('escucha','','');reloj()}
    setTimeout(arrancar,250);
    if(SAF)setTimeout(function(){if(VZ.activo&&!VZ.corriendo&&!VZ.hablando)pintaVoz('quieto','','Toca la esfera para hablar otra vez')},900);
  }
  function sintetizar(){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){setTimeout(listo,Math.min(6000,1200+limpio.length*45));return}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(limpio);u.lang='es-ES';u.rate=1.03;u.pitch=.88;
    var v=elegirVoz();if(v){u.voice=v;u.lang=v.lang}
    u.onend=listo;u.onerror=function(ev){if(ev&&ev.error==='not-allowed'){VZ.pend=limpio;aviso('El navegador bloquea la voz. Toca «Escuchar» para oírla.');if(VZ.activo||(VZ.ov&&!VZ.ov.hidden))pintaVoz('quieto',null,limpio)}listo()};
    speechSynthesis.speak(u);
    setTimeout(listo,Math.min(30000,2500+limpio.length*90));
  }catch(e){listo()}
  }
  pararAudio();
  if(VZ.el){
    setTimeout(function(){if(!hecho&&VZ.hablando)listo()},45000);
    hablarEL(limpio,listo,function(bloq){
      if(bloq){VZ.pend=limpio;aviso('El navegador bloquea el audio. Toca «Escuchar» para oírlo.');if(VZ.activo||(VZ.ov&&!VZ.ov.hidden))pintaVoz('quieto',null,limpio);listo()}
      else sintetizar();
    });
  }else sintetizar();
}

function hablarEL(txt,ok,mal){
  var code='';try{code=localStorage.getItem('ninance-code')||''}catch(e){}
  fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json','x-ninance-code':code},body:JSON.stringify({text:txt})}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){
    var a=audioEl(),u=URL.createObjectURL(b);

function dictar(){
  if(!vozOk()){aviso('Este navegador no permite dictado. Usa Chrome o Edge.');return}
  desbloquearVoz();
  var C=window.SpeechRecognition||window.webkitSpeechRecognition,r=new C();

  var ta=document.getElementById('chat-in'),env=false;

  r.onend=function(){VZ.dictando=false;setTimeout(arrancar,300)};

}
